[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/brasaland-supervisord.pid

[program:auth]
directory=/app/services/api-auth
command=/app/services/api-auth/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8001 --workers 1
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:suppliers]
directory=/app/services/api-suppliers
command=/app/services/api-suppliers/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:incidents]
directory=/app/services/api-incidents
command=/app/services/api-incidents/.venv/bin/uvicorn main:app --host 0.0.0.0 --port 8002 --workers 1
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
