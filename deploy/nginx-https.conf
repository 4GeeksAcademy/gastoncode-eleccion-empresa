log_format brasaland '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                     '"$http_user_agent"';

limit_req_zone $binary_remote_addr zone=brasaland_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=brasaland_register:10m rate=10r/m;

server {
    listen 80;
    server_name 206.189.176.237;
    access_log /var/log/nginx/brasaland-redirect-access.log brasaland;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/brasaland-acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://206.189.176.237:3000$request_uri;
    }
}

server {
    listen 3000 ssl;
    server_name 206.189.176.237;
    ssl_certificate /etc/letsencrypt/live/206.189.176.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/206.189.176.237/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/brasaland-website-access.log brasaland;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location / {
        proxy_pass http://127.0.0.1:13006;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

server {
    listen 8000 ssl;
    server_name 206.189.176.237;
    ssl_certificate /etc/letsencrypt/live/206.189.176.237/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/206.189.176.237/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/brasaland-backoffice-access.log brasaland;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location ~ ^/(incidents-analyzer|inventory-management|talent-pipeline-tracker)(/|$) {
        default_type text/plain;
        return 410 "Este modulo no esta disponible en este despliegue.\n";
    }

    location ~ ^/api/(inventory|talent)(/|$) {
        default_type text/plain;
        return 410 "Este modulo no esta disponible en este despliegue.\n";
    }

    location ~ ^/api/auth/(login|forgot-password|reset-password)/?$ {
        limit_req zone=brasaland_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api/users/?$ {
        limit_req zone=brasaland_register burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:13000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
