[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/brasaland-supervisord.pid

[program:website]
directory=/app/uis/website
command=npm run start -- -H 0.0.0.0
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:dashboard]
directory=/app/uis/backoffice/dashboard-backoffice
command=npm run start -- -H 0.0.0.0
autostart=true
autorestart=true
startsecs=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:suppliers]
