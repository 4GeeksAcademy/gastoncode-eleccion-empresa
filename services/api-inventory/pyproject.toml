[project]
name = "api-inventory"
version = "0.1.0"
description = "Brasaland inventory API backed by Supabase PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
test = [
    "httpx2>=2.16.0",
    "pytest>=8.3.0",
]

[tool.uv]
package = false
