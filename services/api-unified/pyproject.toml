[project]
name = "brasaland-unified-api"
version = "0.1.0"
description = "Modular FastAPI application consolidating Brasaland domain APIs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "bcrypt>=4.0.0,<5.0.0",
    "pydantic[email]>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "resend>=2.40.0",
    "tinydb>=4.9.0",
    "sqlmodel>=0.0.24",
    "psycopg[binary]>=3.2.9",
    "uvicorn[standard]>=0.52.4",
    "incidents-analysis",
]

[dependency-groups]
test = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.uv.sources]
incidents-analysis = { path = "../../packages/incidents_analysis", editable = true }
