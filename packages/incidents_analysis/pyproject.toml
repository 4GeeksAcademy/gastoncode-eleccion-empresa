[project]
name = "incidents-analysis"
version = "0.1.0"
description = "Comparte lógica de validación y análisis del CSV de incidencias de Brasaland"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["incidents_analysis*"]